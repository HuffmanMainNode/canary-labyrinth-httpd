name: Contract, canary tests, and STIX validation

on:
  push:
    paths:
      - 'CONTRACT.md'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'canary_httpd.py'
      - 'tests/**'
      - 'requirements-*.txt'
      - 'Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - 'DEFINITIONS.md'
      - 'llms.txt'
      - '.gitignore'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'CONTRACT.md'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'canary_httpd.py'
      - 'tests/**'
      - 'requirements-*.txt'
      - 'Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - 'DEFINITIONS.md'
      - 'llms.txt'
      - '.gitignore'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical contract and compatibility schema copies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CONTRACT.md)" = "cd04d1046df036894a5b68796fdc007d4ab7cc82"
          test "$(git hash-object schemas/compatibility.schema.json)" = "e565766ca037479c441ce21dd866fbb8209d7615"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run deterministic HTTP, event, privacy, and STIX tests
        run: python -m unittest discover -v
      - name: Validate compatibility and event schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema_paths = [
              "schemas/compatibility.schema.json",
              "schemas/event.schema.json",
          ]
          schemas = {}
          for schema_path in schema_paths:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              schemas[schema_path] = schema

          manifest = json.loads(Path("COMPATIBILITY.json").read_text(encoding="utf-8"))
          Draft202012Validator(
              schemas["schemas/compatibility.schema.json"],
              format_checker=FormatChecker(),
          ).validate(manifest)
          print("TIER-1: compatibility and event schemas validated.")
          PY
      - name: Check CLI entry point
        run: python canary_httpd.py --help
